name: Open PR for dev/implementation branches

on:
  create:
    branches:
      - "dev/implementation/**"

permissions:
  pull-requests: write
  contents: read

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ github.ref_name }}"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "$branch" \
            --body "Automated PR for branch \`$branch\`." \
            --assignee eatsleepraverepeat
